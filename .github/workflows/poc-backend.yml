name: PoC backend checks
on:
  pull_request:
    branches: [codex/poc-demo]
    paths:
      - services/**
      - packages/poc-routing/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - apps/web/package.json
      - .github/workflows/poc-backend.yml
  push:
    branches: [codex/poc-demo]
    paths:
      - services/**
      - packages/poc-routing/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - apps/web/package.json
      - .github/workflows/poc-backend.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poc-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  usage:
    name: Usage build, tests and image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.1'
          cache: npm
      - name: Verify runtime and install lockfile
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(npm --version)" = "11.16.0"
          npm ci --no-audit --no-fund
      - name: Build Usage and check current runtime and authorization contracts
        run: |
          npm run build --workspace=@vinlook/usage
          npm run check:scaffold
          node --test tests/runtime-health.test.mjs tests/authorization.test.mjs
      - name: Run available Usage and routing module tests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, appendFile } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          const files = [];
          for (const directory of ['services/usage/test', 'packages/poc-routing/test']) {
            let entries;
            try { entries = await readdir(directory, { recursive: true }); }
            catch (error) { if (error.code !== 'ENOENT') throw error; entries = []; }
            const found = entries.filter(file => /\.test\.(?:mjs|js)$/.test(file) && !/\.integration\.test\.(?:mjs|js)$/.test(file));
            if (!found.length) console.log(`::notice::No module tests in ${directory} at this commit; not covered by this run`);
            files.push(...found.map(file => `${directory}/${file}`));
          }
          files.sort();
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `Module test files discovered: ${files.length}. Missing suites are not a test pass.\nUsage business endpoints/catalog/integration are not established by this packaging job.\n`);
          if (files.length) {
            const child = spawnSync(process.execPath, ['--test', ...files], { stdio: 'inherit', timeout: 180000 });
            if (child.error || child.status !== 0) process.exit(1);
          }
          NODE
      - name: Build allowlisted Usage production image
        run: docker build --file services/usage/Dockerfile --tag vinlook-usage:poc-ci .
      - name: Verify actual Usage entrypoint in an isolated image
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { randomUUID } from 'node:crypto';
          import { setTimeout as delay } from 'node:timers/promises';
          const image = 'vinlook-usage:poc-ci';
          const docker = args => execFileSync('docker', args, { encoding: 'utf8', timeout: 30000, stdio: ['ignore', 'pipe', 'pipe'] });
          const config = JSON.parse(docker(['image', 'inspect', image]))[0].Config;
          assert.equal(config.User, 'node');
          assert.deepEqual(config.Cmd, ['node', 'src/server.js']);
          assert.equal(config.WorkingDir, '/app/services/usage');
          const name = `vinlook-poc-usage-${randomUUID()}`;
          let created = false;
          try {
            // Do not override CMD: configuration and bootstrap must actually execute.
            docker(['run', '-d', '--name', name, '--network', 'none', '--read-only', '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges', '--memory', '256m', '--cpus', '1', image]);
            created = true;
            const probe = `
              import assert from 'node:assert/strict';
              import {existsSync,readdirSync} from 'node:fs';
              assert.notEqual(process.getuid(),0);
              for(const path of ['/app/.git','/app/.env','/app/services/usage/test','/app/docs','/app/apps','/app/services/content','/app/services/identity'])assert.equal(existsSync(path),false);
              const walk=path=>{for(const item of readdirSync(path,{withFileTypes:true})){assert.ok(!item.name.startsWith('.env'));assert.ok(!/\\.(?:pem|key)$/.test(item.name));if(item.isDirectory())walk(path+'/'+item.name);}};
              walk('/app/services/usage');
              for(const [path,status,code] of [['/health/live',200,'up'],['/health/ready',503,'DEPENDENCIES_UNVERIFIED']]){
                const response=await fetch('http://127.0.0.1:10000'+path,{signal:AbortSignal.timeout(2000)});
                const value=await response.json();assert.equal(response.status,status);
                assert.equal(status===200?value.data.status:value.error.code,code);
                assert.equal(response.headers.get('cache-control'),'no-store');
              }
            `;
            let healthy = false;
            for (let attempt = 0; attempt < 20; attempt++) {
              try { docker(['exec', name, 'node', '--input-type=module', '-e', probe]); healthy = true; break; }
              catch { await delay(250); }
            }
            assert.ok(healthy, 'Usage production bootstrap/health or image inventory failed');
            const bad = docker(['run', '--rm', '--network', 'none', '--read-only', '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges', '--memory', '256m', '--cpus', '1', image, 'node', '--input-type=module', '-e', `
              import assert from 'node:assert/strict';
              import {spawnSync} from 'node:child_process';
              const child=spawnSync(process.execPath,['src/server.js'],{encoding:'utf8',timeout:5000,env:{...process.env,HOST:'synthetic-invalid-host'}});
              assert.equal(child.status,1);assert.equal(child.stdout,'');
              assert.equal(child.stderr.trim(),'Invalid runtime configuration: HOST');
              console.log('invalid-config-denied');
            `]);
            assert.equal(bad.trim(), 'invalid-config-denied');
            docker(['stop', '--time', '5', name]);
            const state = JSON.parse(docker(['inspect', name]))[0].State;
            assert.equal(state.ExitCode, 0); assert.equal(state.OOMKilled, false);
            console.log('Usage real CMD: nonroot/read-only/network-none; live200/ready503; invalid config denied; graceful stop passed. No business readiness claimed.');
          } finally { if (created) docker(['rm', '-f', name]); }
          NODE
      - name: State coverage boundary
        run: |
          echo 'Packaging and available tests only. No Usage business DB suite, live deployment, caller-key acceptance, multidevice, load or cold-start acceptance is implied.' >> "$GITHUB_STEP_SUMMARY"
  regression:
    name: Regression (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [identity, content]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.1'
          cache: npm
      - name: Verify runtime and install lockfile
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(npm --version)" = "11.16.0"
          npm ci --no-audit --no-fund
      - name: Existing service syntax and unit contracts
        run: node scripts/ci-service-checks.mjs ${{ matrix.service }}
      - name: Existing disposable Mongo replica-set suites
        run: node scripts/ci-service-integration.mjs ${{ matrix.service }}
