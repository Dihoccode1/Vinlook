name: Backend checks
on:
  pull_request:
    paths: ['services/**', 'scripts/**', 'tests/**', 'package*.json', 'apps/web/package.json', '.github/workflows/backend-checks.yml']
  push:
    branches: [main]
    paths: ['services/**', 'scripts/**', 'tests/**', 'package*.json', 'apps/web/package.json', '.github/workflows/backend-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service: [identity, content]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.1'
          cache: npm
      - name: Verify runtime and install locked dependencies
        run: |
          test "$(npm --version)" = "11.16.0"
          npm ci --no-audit --no-fund
      - name: Syntax and unit checks
        run: node scripts/ci-service-checks.mjs ${{ matrix.service }}
      - name: Disposable Mongo replica-set integration suites
        run: node scripts/ci-service-integration.mjs ${{ matrix.service }}
      - name: Build actual production image
        run: docker build --file services/${{ matrix.service }}/Dockerfile --tag vinlook-${{ matrix.service }}:ci .
      - name: Nonroot image and converter smoke
        run: node scripts/ci-image-smoke.mjs ${{ matrix.service }} vinlook-${{ matrix.service }}:ci
